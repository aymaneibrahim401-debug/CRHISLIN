<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="Casse-Blocs — mini-jeu arcade du portfolio de RAJAONARISON CHRISLIN">
<meta name="theme-color" content="#04040c">
<title>Casse-Blocs — RAJAONARISON CHRISLIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@700;800&display=swap" as="style">
<link rel="stylesheet" href="../style/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Styles du mini-jeu Casse-Blocs (scopés à .game-page) ===== */
  .game-page{
    background: radial-gradient(ellipse at center, #0a0e2e 0%, #000005 70%);
  }
  .game-page .site-header{
    background:rgba(4,4,12,0.85);
    border-bottom:1px solid rgba(0,255,255,0.25);
    backdrop-filter:blur(6px);
  }
  .game-page .site-header .name{ color:#fff; text-shadow:0 0 8px rgba(255,0,255,.6); }
  .game-page .site-header .tag{ color:#7fdfff; }
  .game-page nav.tabs{ background:rgba(255,255,255,0.06); }
  .game-page nav.tabs a{ color:#dff; }
  .game-page nav.tabs a:hover{ background:rgba(0,255,255,0.12); color:#fff; }
  .game-page nav.tabs a.active{ background:linear-gradient(135deg,#00d4ff,#ff00e0); color:#04040c; }
  .game-page .menu-toggle{ background:rgba(255,255,255,0.08); border-color:rgba(0,255,255,0.35); }
  .game-page .menu-toggle span{ background:#dff; }

  .game-main{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 90px);
    padding:32px 16px;
    font-family:'Orbitron','Courier New',monospace;
  }
  #wrap{
    display:flex;
    gap:26px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
    max-width:100%;
  }
  #canvasBox{
    position:relative;
    border-radius:10px;
    padding:4px;
    background:linear-gradient(135deg,#00ffff,#ff00ff,#00ffff);
    box-shadow:0 0 40px rgba(0,255,255,0.5),0 0 80px rgba(255,0,255,0.15);
    max-width:100%;
  }
  #game{
    background:#04040c;
    display:block;
    border-radius:7px;
    width:min(420px,80vw);
    height:auto;
    touch-action:none;
  }
  #side{
    color:#dff;
    width:190px;
    padding-top:6px;
  }
  #side h1{
    color:#fff;
    font-size:24px;
    letter-spacing:3px;
    margin:0 0 24px 0;
    text-shadow:0 0 8px #ff00ff,0 0 18px #ff00ff;
    line-height:1.3;
  }
  .game-page .panel{
    background:linear-gradient(135deg,rgba(0,255,255,0.06),rgba(255,0,255,0.06));
    border:1px solid rgba(0,255,255,0.35);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
    box-shadow:inset 0 0 12px rgba(0,255,255,0.08);
  }
  .game-page .label{
    color:#ff33cc;
    font-weight:bold;
    font-size:12px;
    letter-spacing:2px;
    text-shadow:0 0 6px rgba(255,51,204,0.7);
  }
  .game-page .value{
    font-size:24px;
    letter-spacing:2px;
    color:#00ffff;
    text-shadow:0 0 10px rgba(0,255,255,0.8);
  }
  #chrono.warn{
    color:#ff3355;
    text-shadow:0 0 12px rgba(255,51,85,0.9);
    animation:pulse 0.6s infinite alternate;
  }
  @keyframes pulse{ from{opacity:1;} to{opacity:0.55;} }
  #hint{
    font-size:12px;
    color:#7fdfff;
    margin-top:20px;
    line-height:1.6;
    opacity:0.75;
  }
  #overlay{
    position:fixed;
    inset:0;
    background:rgba(2,2,10,0.88);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:24px;
    text-align:center;
    gap:18px;
    backdrop-filter:blur(3px);
    z-index:500;
  }
  .game-page button#startBtn{
    background:linear-gradient(135deg,#00ffff,#ff00ff);
    border:none;
    padding:12px 30px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
    letter-spacing:2px;
    border-radius:6px;
    color:#04040c;
    box-shadow:0 0 20px rgba(0,255,255,0.6);
    transition:transform 0.15s ease;
    font-family:'Orbitron','Courier New',monospace;
  }
  .game-page button#startBtn:hover{ transform:scale(1.06); }
  #countdown{
    position:absolute;
    color:#fff;
    font-size:60px;
    font-weight:bold;
    text-shadow:0 0 20px #00ffff,0 0 40px #ff00ff;
    pointer-events:none;
    display:none;
  }

  @media (max-width:640px){
    .game-main{ padding:20px 12px; }
    #wrap{ gap:16px; }
    #side{ width:min(420px,80vw); }
  }
</style>
</head>
<body class="game-page">

<header class="site-header">
  <a class="brand" href="../index.html">
    <span class="name">RAJAONARISON CHRISLIN</span>
    <span class="tag">Carnet personnel — portofolio</span>
  </a>
  <button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav class="tabs">
    <a href="../index.html"><span class="num"></span>Accueil</a>
    <a href="apropos.html"><span class="num"></span>À propos</a>
    <a href="cv.html"><span class="num"></span>Mon CV</a>
    <a href="favoris.html"><span class="num"></span>Mes favoris</a>
    <a href="jeu.html" class="active"><span class="num"></span>Jeu</a>
    <a href="contact.html"><span class="num"></span>Contact</a>
  </nav>
</header>

<main class="game-main">

<div id="wrap">
  <div id="canvasBox">
    <canvas id="game" width="420" height="500"></canvas>
    <div id="countdown"></div>
  </div>
  <div id="side">
    <h1>CASSE&#8209;BLOCS</h1>
    <div class="panel">
      <div class="label">SCORE</div>
      <div class="value" id="score">000000</div>
    </div>
    <div class="panel">
      <div class="label">TEMPS</div>
      <div class="value" id="chrono">02:00</div>
    </div>
    <div class="panel">
      <div class="label">VIES</div>
      <div class="value" id="lives">🔵🔵🔵</div>
    </div>
    <div id="hint">
      ← → , souris ou doigt : déplacer<br>
      La balle se lance seule<br>
      après 2 secondes<br>
      P : pause
    </div>
  </div>
</div>

<div id="overlay">
  <div id="overlay-text">CASSE&#8209;BLOCS<br><span style="font-size:16px">Clique pour commencer</span></div>
  <button id="startBtn">JOUER</button>
</div>

</main>

<script src="../js/menu.js"></script>
<script src="../js/page-transition.js"></script>

<script src="../js/casse-blocs.js"></script>

<footer class="site-footer" style="border-top-color:rgba(0,255,255,0.2); color:#7fdfff;">
  <div class="footer-inner">
    <div class="footer-copy">© 2026 RAJAONARISON CHRISLIN</div>
    <div class="footer-social" aria-label="Réseaux sociaux">
      <a class="social-bubble facebook" href="https://www.facebook.com/profile.php?id=61583188924986"
         target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a>
      <a class="social-bubble whatsapp" href="https://wa.me/261374159496"
         target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">◔</a>
    </div>
  </div>
</footer>

</body>
</html>
